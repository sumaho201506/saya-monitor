   name: update-prices
   on:
     schedule:
       - cron: "5 0-7 * * 1-5"
     workflow_dispatch: {}

   permissions:
     contents: write

   jobs:
     run:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-python@v5
           with:
             python-version: "3.12"
         - run: pip install -r requirements.txt
         - run: python fetch_prices.py
         - name: Commit if changed
           run: |
             git config user.name "price-bot"
             git config user.email "price-bot@users.noreply.github.com"
             git add prices.json
             git diff --cached --quiet || (git commit -m "update prices" && git push)
